# Default value: 肥料,种子,冰块,木板,木片,木材,石头,石块,铁片,铁皮,铁锭,金属,塑料,玻璃
NameKeywords = 肥料,种子,冰块,木板,木片,木材,石头,石块,铁片,铁皮,铁锭,金属,塑料,玻璃

## 精确名称规则（优先级高于关键字）：`名称` / `名称@ID` / `名称=数值` / `名称@ID=数值`，多个用逗号分隔
# Setting type: String
# Default value: 铁丝,电器元件,容器,卡式气瓶,门板修补材料,窗户修补材料,纸片,硬纸,报纸=1,纸条=1,纸牌=1
