## 堆叠优化总开关（false=停用：不抬堆叠上限、不自动合并/落袋合并、丢弃键丢一停用；右键拆分由 [Split] Enabled 单独控制；一键制作的拆取通道始终可用）
# Setting type: Boolean
# Default value: true
Enabled = true

## 关键字（包含匹配）规则：`关键字` 或 `关键字=数值`，多个用逗号分隔；对全部物品（含自定义物品）生效，优先级低于 ExactNames
