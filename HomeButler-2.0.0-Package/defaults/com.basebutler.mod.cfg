## 未在规则中单独写数值时的默认堆叠上限
# Setting type: Int32
# Default value: 5
StackLimit = 5

## 全局兜底：所有原本可堆叠（当前上限>=2）且未命中 ExactNames/NameKeywords 规则的物品，统一改为该上限；0 = 关闭
# Setting type: Int32
# Default value: 0
AllStackableLimit = 0

## 自动合并（true=启用）：后台把同一容器内【游戏自己认为可合并】的同种物品多堆自动并成一堆，无需任何操作/按键。仅合并逐实例数据完全一致的堆（如木片/木材），烹饪家具内的逐件独立存放不受影响
# Setting type: Boolean
# Default value: true
AutoMerge = true

## 自动合并扫描间隔（秒）。默认 5 秒，幂等，没得合时几乎无开销
# Setting type: Single
# Default value: 5
AutoMergeIntervalSec = 5

## 强制合并（true=启用）：对【无保质期且无品质/耐久附加数据】的普通材料（木片/木板/铁皮等），即使两堆的逐实例数据不完全一致也并成一堆（以目标堆数据为准）。食物与带品质/耐久的物品不受影响
# Setting type: Boolean
# Default value: true
AutoMergeForce = true

## 打印"同种物品有多堆却合不了"的实例字段差异（排查用，每个物品只打一次）
# Setting type: Boolean
# Default value: true
AutoMergeLogDiff = true

## 落袋即合并（true=启用，推荐）：物品被放进容器时，若原版因为逐实例数据不一致而找不到可并的堆，就对普通材料放宽判定、直接并进已有的同类堆，从源头避免同种物品分堆。食物（有保质期）、带品质/耐久、以及烹饪家具袋内不受影响
# Setting type: Boolean
# Default value: true
PreMerge = true

## 有时效物品也自动合并（true=启用）：同种食物的多堆会先按【剩余保质期最长的那堆】统一保质期，再并成一堆 —— 结果按最高保质期生效。发霉(污染)与新鲜分属不同子组，不会混在一起
# Setting type: Boolean
# Default value: true
AutoMergePerishable = false

## 标签差异也合并（true=启用，推荐）：允许【只差标签类字段（地图预置 preset / 已拆包 nopkg）】的同种物品并成一堆。这两项只记录物品来源，不改变新鲜度/污染/耐久/品质。可乐那种「一堆2一堆3怎么都合不上」就是被它卡住的。关掉则回到严格判定（只并逐实例字段完全一致的堆）
# Setting type: Boolean
# Default value: true
MergeFlagDiff = true

## 落袋即合并（true=启用，推荐）：物品刚放进容器就立刻催一次合并，有保质期的食物/饮料也一样（不必等满 AutoMergeIntervalSec）。保质期不一致时按【最长的那堆】统一生效。关掉则只按固定间隔扫描
# Setting type: Boolean
# Default value: true
MergeOnPickup = true

